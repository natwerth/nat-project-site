<section class="c-showcase contact-section" id="contact" aria-labelledby="contact-title">
 <div class="c-showcase__inner">
  <h2 id="contact-title" class="section-title">Contact</h2>
  <div class="c-card">
   <form id="consultForm" class="c-form" novalidate>
    <fieldset id="svc-group"><legend>I’m interested in <span aria-hidden="true">*</span></legend><div class="svc-pills"><input id="svc-resume-review" name="service" type="radio" value="resume-review" required aria-describedby="svcErr"><label for="svc-resume-review"><i class="fa-solid fa-file-lines" aria-hidden="true"></i>Resume Reviews</label>
<input id="svc-ask-nat" name="service" type="radio" value="ask-nat" required aria-describedby="svcErr"><label for="svc-ask-nat"><i class="fa-solid fa-comments" aria-hidden="true"></i>Ask Nat</label>
<input id="svc-project-help" name="service" type="radio" value="project-help" required aria-describedby="svcErr"><label for="svc-project-help"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>Project Help</label></div><span class="err" id="svcErr" hidden>Select a service to keep things moving.</span></fieldset>
    <div class="two"><div class="row"><label for="name">Name <span aria-hidden="true">*</span></label><input id="name" name="name" data-label="Name" aria-describedby="name-error" required type="text" autocomplete="name" maxlength="500" placeholder=""><span id="name-error" class="err" hidden></span></div><div class="row"><label for="email">Email <span aria-hidden="true">*</span></label><input id="email" name="email" data-label="Email" aria-describedby="email-error" required type="email" autocomplete="email" maxlength="254" placeholder=""><span id="email-error" class="err" hidden></span></div></div>
<fieldset class="service-fields" data-service-fields="resume-review" hidden disabled><legend class="sr-only">Resume Reviews details</legend><div class="row"><label for="resume-goal">Target role <span aria-hidden="true">*</span></label><input id="resume-goal" name="resume-goal" data-label="Target role or career direction" aria-describedby="resume-goal-error" required type="text" autocomplete="off" maxlength="500" placeholder="e.g., Marketing internships or my first engineering role"><span id="resume-goal-error" class="err" hidden></span></div><div class="row"><label for="resume-questions">Questions <small>(optional)</small></label><textarea id="resume-questions" name="resume-questions" data-label="Questions for the review" aria-describedby="resume-questions-error" rows="4" maxlength="6000" placeholder="What would you like feedback on?"></textarea><span id="resume-questions-error" class="err" hidden></span></div></fieldset>
<fieldset class="service-fields" data-service-fields="ask-nat" hidden disabled><legend class="sr-only">Ask Nat details</legend><div class="row"><label for="ask-question">What’s your question? <span aria-hidden="true">*</span></label><textarea id="ask-question" name="ask-question" data-label="What’s your question?" aria-describedby="ask-question-error" required rows="4" maxlength="6000" placeholder="Tell me what’s on your mind…"></textarea><span id="ask-question-error" class="err" hidden></span></div></fieldset>
<fieldset class="service-fields" data-service-fields="project-help" hidden disabled><legend class="sr-only">Project Help details</legend><div class="row"><label for="project-goal">What would you like help with? <span aria-hidden="true">*</span></label><textarea id="project-goal" name="project-goal" data-label="What would you like help with?" aria-describedby="project-goal-error" required rows="4" maxlength="6000" placeholder="What are you trying to make, fix, or simplify?"></textarea><span id="project-goal-error" class="err" hidden></span></div><div class="two"><div class="row"><label for="project-timeline">Timeline <small>(optional)</small></label><input id="project-timeline" name="project-timeline" data-label="Timeline" aria-describedby="project-timeline-error" type="text" autocomplete="off" maxlength="500" placeholder="A date, a rough idea, or “flexible”"><span id="project-timeline-error" class="err" hidden></span></div><div class="row"><label for="project-budget">Budget <small>(optional)</small></label><input id="project-budget" name="project-budget" data-label="Budget" aria-describedby="project-budget-error" type="text" autocomplete="off" maxlength="500" placeholder="A range or “not sure yet”"><span id="project-budget-error" class="err" hidden></span></div></div></fieldset>
    <input type="hidden" name="source" value="consulting">
    <input type="hidden" name="intent" value="details">
    <!-- The server rejects nonempty honeypot values. -->
    <div class="form-honeypot" hidden aria-hidden="true"><label for="hp">Leave this field empty</label><input id="hp" type="text" name="hp" autocomplete="off" tabindex="-1"></div>
    <div class="row">
     <button type="submit" class="btn-primary" id="submitBtn" disabled>Send request</button>
     <small>Fields marked * are required. By submitting, you consent to being contacted about this request.</small>
     <p class="form-status" id="submitStatus" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden></p>
     <div class="err" id="submitErr" role="alert" hidden></div>
     <div class="form-actions">
      <button type="button" class="btn-secondary" id="checkStatusBtn" hidden>Check status</button>
      <a id="thankyouLink" href="/thankyou/" hidden>View confirmation</a>
      <button type="button" class="btn-secondary" id="anotherRequestBtn" hidden>Start another request</button>
     </div>
    </div>
   </form>
   <noscript><p>Please enable JavaScript to use this form.</p></noscript>
  </div>
 </div>
</section>
<div class="services-home"><a href="/">← Back to home</a></div>
